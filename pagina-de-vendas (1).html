        :root {
            --color-dark-bg: hsl(210, 10%, 7%);
            --color-accent-green: hsl(140, 100%, 60%);
            --color-white: hsl(0, 0%, 100%);
            --color-card-bg: hsl(140, 30%, 18%);

            --color-grid-line: hsla(210, 5%, 15%, 0.5);
            --font-family-primary: 'Arial', sans-serif; /* Using a common sans-serif font */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 var(--color-accent-green); }
            70% { box-shadow: 0 0 0 10px rgba(51, 255, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(51, 255, 153, 0); }
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-family-primary);

            color: var(--color-white);

            overflow-x: hidden;
            position: relative;
        }

        /* Grid Background from Image 1 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
            background-size: 50px 50px; /* Adjust grid size as needed */
            z-index: -1;
            opacity: 0.2;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: clamp(20px, 5vw, 60px) clamp(15px, 4vw, 40px);
            text-align: center;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: bold;
            margin-bottom: 1em;
        }

        h1 {
            font-size: clamp(2.5em, 8vw, 4.5em);
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 0.5em;
        }

        h2 {
            font-size: clamp(1.8em, 6vw, 3em);
            line-height: 1.2;
            text-transform: uppercase;
        }

        h3 {
            font-size: clamp(1.4em, 5vw, 2.2em);
            line-height: 1.3;
            margin-bottom: 0.8em;
        }

        p {
            font-size: clamp(1em, 3vw, 1.15em);
            margin-bottom: 1em;
        }

        .text-green {
            color: var(--color-accent-green);
        }

        .btn {
            display: inline-block;
            background-color: var(--color-accent-green);
            color: var(--color-dark-bg);
            padding: 1.2em 2.5em;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: clamp(1.1em, 4vw, 1.4em);
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            margin-top: 2em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn:hover {
            transform: translateY(-5px);
            background-color: hsl(140, 100%, 50%);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            animation: pulseGreen 1.5s infinite;
        }

        .section {
            padding: clamp(40px, 8vw, 100px) 0;
            position: relative;
            z-index: 1;
        }

            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 0;
            padding-bottom: 0;
